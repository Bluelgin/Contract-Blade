name: Contract Blade Core CI

on:
  push:
    branches:
      - master
      - codex/unified-contract-interior-land
      - codex/fox-level-stats-passive-blessing
  pull_request:
    branches:
      - master
      - codex/fox-native-sword-art
      - codex/black-fox-sword-core-growth
      - codex/contract-lifecycle-recovery
      - codex/white-fox-blessing-growth
      - codex/simplify-contract-lifecycle
      - codex/architecture-refinement
      - codex/white-fox-growth-rework
      - codex/akatsuki-domain
      - codex/akatsuki-provenance-airborne
      - codex/akatsuki-uncapped-space-cut

concurrency:
  group: contract-blade-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare optional compile APIs
        run: |
          mkdir -p libs
          curl -fL --retry 3 --retry-delay 2 \
            "https://edge.forgecdn.net/files/8055/552/tacz-1.20.1-1.1.8-release.jar" \
            -o libs/tacz-1.20.1-1.1.8-release.jar

      - name: Build and player mastery behavioral tests
        run: gradle --no-daemon clean build -Pci=true

      - name: Architecture and data validators
        run: |
          python tools/validate_contract_mastery.py
          python tools/validate_architecture.py
          python tools/validate_legacy_core_boundary.py
          python tools/validate_contract_nbt_safety.py
          python tools/validate_contract_permissions.py
          python tools/validate_contract_resonance.py
          python tools/validate_carrier_loss_recovery.py
          python tools/validate_patchouli.py
          python tools/validate_contract_interiors.py
          python tools/validate_home_life.py
          python tools/validate_epicfight.py
          python tools/validate_item_models.py
          python tools/validate_projection_baubles.py
          python tools/validate_companion.py
          python tools/validate_shrine.py
          python tools/validate_player_tooltips.py
          python tools/validate_fox_models.py
          python tools/test_fox_model_validator.py

      - name: Prepare native regression runtimes
        run: |
          mkdir -p tmp/compat-test
          curl -fL --retry 3 "https://edge.forgecdn.net/files/8061/847/touhoulittlemaid-1.5.3-forge+mc1.20.1.jar" \
            -o libs/touhoulittlemaid-1.5.3-forge+mc1.20.1.jar
          curl -fL --retry 3 "https://cdn.modrinth.com/data/8T53F0sy/versions/pdMMavGH/SlashBladeResharped-1.20.1-1.9.65.jar" \
            -o tmp/compat-test/SlashBladeResharped-1.20.1-1.9.65.jar

      - name: Prepare optional BladeTetra provider runtime
        run: |
          curl -fL --retry 3 "https://github.com/Bluelgin/Blade-Tetra-Forged-Styles/releases/download/v1.5.9/blade_tetra-1.5.9.jar" \
            -o tmp/compat-test/blade_tetra-1.5.9.jar
          curl -fL --retry 3 "https://cdn.modrinth.com/data/YP9DjOvN/versions/lm4Qz4KQ/tetra-1.20.1-6.3.0.jar" \
            -o tmp/compat-test/tetra-6.3.0.jar
          curl -fL --retry 3 "https://cdn.modrinth.com/data/HWHl8Evb/versions/8CZJ2gLR/mutil-1.20.1-6.2.0.jar" \
            -o tmp/compat-test/mutil-1.20.1-6.2.0.jar

      - name: Native awakened Akatsuki provider fixture
        run: python tools/run_stage_three_tests.py --fixture akatsuki-provider

      - name: Real soul damage and anchor interaction fixture
        run: python tools/run_soul_damage_tests.py --gradle gradle

      - name: Native dedicated-server domain and regression fixtures
        run: |
          python tools/run_stage_three_tests.py --fixture akatsuki-domain --compat vanilla
          python tools/run_stage_three_tests.py --fixture akatsuki-domain
          python tools/run_stage_three_tests.py --fixture architecture
          python tools/run_stage_three_tests.py --fixture blessing
          python tools/run_stage_three_tests.py --fixture sword
          python tools/run_stage_three_tests.py --fixture recovery
          python tools/run_stage_three_tests.py --fixture white-se

      - name: Upload test build and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-blade-akatsuki-validation
          path: |
            build/libs/*.jar
            build/test-results/test/*.xml
            /tmp/contract-stage-three-*/*.log
            /tmp/contract-soul-*/server.log
          if-no-files-found: warn
