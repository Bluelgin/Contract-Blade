name: Contract Blade Core CI

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Architecture and data validators
        run: |
          python tools/validate_architecture.py
          python tools/validate_legacy_core_boundary.py
          python tools/validate_contract_nbt_safety.py
          python tools/validate_contract_permissions.py
          python tools/validate_contract_resonance.py
          python tools/validate_emergency_film_recovery.py
          python tools/validate_patchouli.py

      - name: Build
        run: gradle --no-daemon clean build
