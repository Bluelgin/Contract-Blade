name: Contract Blade 1.21.1 NeoForge port probe
on:
  push:
    branches:
      - '1.21.1-neoforge'
  pull_request:
    branches:
      - '1.21.1-neoforge'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-neoforge-port-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check port isolation and inventory old APIs
        run: |
          python3 tools/porting/check_probe.py
          python3 tools/porting/check_shared.py
          python3 tools/porting/test_shared_patch.py
          python3 tools/porting/audit_legacy.py
      - name: Compile NeoForge/TLM probe and run unit tests
        run: ./gradlew --no-daemon build --stacktrace
      - name: Upload diagnostics (NEVER publish as a gameplay release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-port-probe-not-for-play
          path: |
            build/reports/tests/
            build/test-results/
            build/libs/*PORT-PROBE*
            docs/porting/evidence/2026-11-27/
          retention-days: 7
          if-no-files-found: warn

  native-server-smoke:
    name: Native TLM + NeoForge dedicated server smoke
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: compile-probe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify isolated dedicated server and actual clean restart
        run: python3 tools/porting/smoke_server.py
      - name: Preserve native server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-port-native-smoke-logs
          path: |
            run/port-smoke-server/logs/
            run/port-smoke-server/crash-reports/
          retention-days: 7
          if-no-files-found: warn
