name: Contract Blade 1.21.1 native development
on:
  push:
    branches:
      - '1.21.1-neoforge'
  pull_request:
    branches:
      - '1.21.1-neoforge'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-neoforge-port-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-probe:
    name: Native build, unit tests and TLM restart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check port isolation and inventory old APIs
        run: |
          python3 tools/porting/check_probe.py
          python3 tools/porting/check_shared.py
          python3 tools/porting/test_shared_patch.py
          python3 tools/porting/audit_legacy.py
      - name: Build native gameplay adapter and run unit tests
        run: ./gradlew --no-daemon build --stacktrace
      - name: Verify isolated dedicated server and actual clean restart
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: python3 tools/porting/smoke_server.py
      - name: Upload diagnostics (NEVER publish as a gameplay release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-port-probe-not-for-play
          path: |
            build/reports/tests/
            build/test-results/
            build/libs/*DEV-INCOMPLETE*
            docs/porting/evidence/2026-11-27/
            docs/porting/evidence/2026-11-28-native/
            docs/porting/evidence/2026-11-28-projection/
            docs/porting/NATIVE_GAMEPLAY_DELIVERY.md
            docs/porting/NATIVE_PROJECTION_DELIVERY.md
            docs/porting/NATIVE_RESOURCE_INTEGRATION.csv
            docs/porting/audit-2026-11-28/
          retention-days: 7
          if-no-files-found: warn

      - name: Preserve native server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-port-native-smoke-logs
          path: |
            run/native-gameplay-ci-server/logs/
            run/native-gameplay-ci-server/crash-reports/
          retention-days: 7
          if-no-files-found: warn
