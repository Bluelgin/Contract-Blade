<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
  <title id="title">契约心钥 · 连续轮廓第二稿</title>
  <desc id="desc">透明背景的三十二像素钥匙。心形柄沿钥匙轴线朝向，柄、颈、身与钥匙齿共用一个连续外轮廓；银色金属配暖金钥匙齿和紫晶镶嵌。</desc>
  <!-- A single silhouette joins the rotated heart bow, neck, shaft and teeth. -->
  <path fill="#242130" d="M21 2h4v1h2v3h-1v1h2V6h2v2h1v4h-1v2h-3v1h-4v1h-3l-7 7 3 3-2 2-3-3-1 1 3 3-2 2-3-3-2 2-4-4 15-15 1-4 1-3h2z"/>
  <path fill="#8f8995" d="M18 12l3 3L6 28l-2-2z"/>
  <path fill="#ded9cb" d="M18 12l2 2L5 27l-1-1z"/>
  <path fill="#fff4dd" d="M18 12l1 1L5 27l-1-1z"/>
  <!-- Teeth branch directly from the shaft. -->
  <path fill="#8f6a43" d="M10 22l5 4-1 1-5-4zm-3 3 5 4-1 1-5-4z"/>
  <path fill="#d5b57b" d="M10 22l4 4-1 0-4-3zm-3 3 4 4-1 0-4-3z"/>
  <!-- The heart tip points along the diagonal key axis. -->
  <path fill="#a49276" d="M21 4h4v1h1v1h-2v2h3V7h2v2h1v3h-2v1h-3v1h-4l-3 1v-4l1-4h1V5h1z"/>
  <path fill="#d6d0be" d="M21 4h3v1h1v1h-2v3h4V8h2v3h-2v1h-3v1h-4l-2 1v-3l1-3h1V5h1z"/>
  <path fill="#f2ead9" d="M21 4h3v1h-3v2h-1v3h-1V7h1V5h1zm6 4h2v1h-2z"/>
  <path fill="#493251" d="M21 7h2v2h3v2h-2v1h-3l-1 1v-3h1z"/>
  <path fill="#8e68a7" d="M21 7h1v3h3v1h-2v1h-2z"/>
  <path fill="#d8b6e4" d="M21 7h1v2h-1zm2 3h2v1h-2z"/>
  <!-- A continuous highlight crosses the neck into the shaft. -->
  <path fill="#ded9cb" d="M18 11h2v2l-3 3-1-1 2-2z"/>
  <path fill="#fff4dd" d="M18 11h1v2l-3 3-1-1 3-3z"/>
</svg>
