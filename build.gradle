plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}


version = mod_version
group = mod_group_id

def compatTestMode = providers.gradleProperty('compatTest').orElse('vanilla').get()
def compatWorld = providers.gradleProperty('compatWorld').orNull
def tlmTestMode = providers.gradleProperty('tlmTest').orElse('latest').get()
def compatRunDir = providers.gradleProperty('compatRunDir').orNull
def homeLifeTestMode = providers.gradleProperty('homeLifeTest').map { it.toBoolean() }.orElse(false).get()

def ciMode = providers.gradleProperty('ci').map { it.toBoolean() }.orElse(false).get()
def galleryPreviewMode = providers.gradleProperty('galleryPreview')
        .map { it.toBoolean() }
        .orElse(false)
        .get()

repositories {
    flatDir {
        dirs 'libs', 'tmp/compat-test', 'tmp/compat-old'
    }
    // 国内镜像（加速依赖下载）
    maven { url = "https://maven.aliyun.com/repository/public" }
    maven { url = "https://maven.aliyun.com/repository/central" }
    maven { url = "https://maven.aliyun.com/repository/minecraft" }
    maven { url = "https://libraries.minecraft.net" }
    // BMCLAPI Forge 镜像（国内可用）
    maven { url = "https://bmclapi2.bangbang93.com/maven" }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // 本地库
}

base {
    // Public project name used by distribution sites. Keep mod_id unchanged so
    // existing worlds and registry names remain compatible.
    archivesName = "contract-blade-forge-${minecraft_version}"
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        rename { "LICENSE_${mod_id}" }
    }
    from('ASSET_SOURCES.md')
}

// Java 编译版本设置为 17（MC 1.20.1 要求）
// ForgeGradle 需要 toolchain 来正确处理映射
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 关键：设置编译和资源处理的UTF-8编码，防止中文乱码
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

minecraft {
    // 映射通道和版本（使用官方映射）
    mappings channel: 'official', version: minecraft_version

    // 运行配置
    runs {
        configureEach {
            workingDirectory project.file(compatRunDir ?: 'run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'contractblade.home.validation', galleryPreviewMode.toString()
            property 'contractblade.home.nativeValidation', homeLifeTestMode.toString()
            property 'forge.logging.console.level', 'debug'
            // Remap mixin refmaps from external 1.20.1 libraries in the userdev runtime.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            jvmArgs '-Xms384m', '-Xmx1280m'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            jvmArgs '-Xms256m', '-Xmx1024m'
            args '--nogui'
            if (compatWorld) {
                args '--world', compatWorld
            }
        }

        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// 将生成的资源目录加入资源集
sourceSets.main.resources { srcDir 'src/generated/resources' }


// 依赖配置
dependencies {
    // Minecraft Forge
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mandatory Touhou Little Maid runtime for launch profiles. CI compiles the
    // version-tolerant reflection boundary without resolving a local runtime jar.
    if (!ciMode || homeLifeTestMode) {
        if (tlmTestMode == 'old') {
            runtimeOnly fg.deobf("compat:touhoulittlemaid:1.20.1-release-1.1.7")
        } else if (tlmTestMode == 'pack') {
            runtimeOnly fg.deobf("compat:touhoulittlemaid:1.5.2-forge+mc1.20.1")
        } else {
            runtimeOnly fg.deobf("local:touhoulittlemaid:1.5.3-forge+mc1.20.1")
        }
    }

    // Compile against TACZ without bundling it. Local development keeps the
    // ForgeGradle deobf path; clean CI uses the public CurseMaven jar directly
    // because only TACZ's stable API types are required at compile time.
    def localTacz = file('libs/tacz-1.20.1-1.1.8-release.jar').exists()
    def taczDependency = localTacz
            ? "local:tacz:1.20.1-1.1.8-release"
            : "curse.maven:timeless-and-classics-zero-1028108:8055552"
    if (ciMode && !localTacz) {
        compileOnly taczDependency
    } else {
        compileOnly fg.deobf(taczDependency)
    }
    if (compatTestMode == 'tacz' && !ciMode) {
        runtimeOnly fg.deobf(taczDependency)
    }

    // Optional local launch matrix. These are runtime-only and never bundled.
    if (compatTestMode in ['goety', 'both', 'maidspell-goety', 'maidspell-both']) {
        runtimeOnly fg.deobf("compat:goety:2.5.55.4")
        runtimeOnly fg.deobf("compat:curios-forge:5.14.1+1.20.1")
    }
    if (compatTestMode in ['irons', 'both', 'maidspell-irons', 'maidspell-both']) {
        runtimeOnly fg.deobf("compat:irons_spellbooks:1.20.1-3.16.2")
        runtimeOnly fg.deobf("compat:curios-forge:5.14.1+1.20.1")
        runtimeOnly fg.deobf("compat:geckolib-forge-1.20.1:4.8.4")
        runtimeOnly fg.deobf("compat:player-animation-lib-forge:1.0.2-rc1+1.20")
        runtimeOnly fg.deobf("compat:irons_lib:1.20.1-2.1.0")
    }
    if (compatTestMode in ['maidspell-goety', 'maidspell-irons', 'maidspell-both']) {
        runtimeOnly fg.deobf("compat:touhou_little_maid_spell:1.8.0.1-forge+mc1.20.1")
    }
    if (compatTestMode in ['old-goety', 'old-both']) {
        runtimeOnly fg.deobf("compat:goety:2.5.1.2")
        runtimeOnly fg.deobf("compat:curios-forge:5.14.1+1.20.1")
    }
    if (compatTestMode in ['old-irons', 'old-both']) {
        runtimeOnly fg.deobf("compat:irons_spellbooks:1.20.1-1.2.1")
        runtimeOnly fg.deobf("compat:curios-forge:5.14.1+1.20.1")
        runtimeOnly fg.deobf("compat:geckolib-forge-1.20.1:4.8.4")
        runtimeOnly fg.deobf("compat:player-animation-lib-forge:1.0.2-rc1+1.20")
        runtimeOnly fg.deobf("compat:caelus-forge:3.2.0+1.20.1")
    }
    if (compatTestMode == 'patchouli') {
        // Development-only validation profile. Patchouli remains optional for shipped builds.
        runtimeOnly fg.deobf("compat:Patchouli:1.20.1-85-FORGE")
    }
    if (compatTestMode in ['slashblade', 'true-power', 'native-power']) {
        // Development-only validation profile. SlashBlade remains optional for shipped builds.
        runtimeOnly fg.deobf("compat:SlashBladeResharped:1.20.1-1.9.65")
    }
    if (compatTestMode == 'true-power') {
        // Full optional stack used to validate the dedicated maid task and soul baubles.
        runtimeOnly fg.deobf("compat:mrqxs_Slashblade_Core:1.20.1-1.4.1")
        runtimeOnly fg.deobf("compat:True_POWER:1.20.1-1.2.1-hotfix1")
        runtimeOnly fg.deobf("compat:True_POWER_of_Maid:1.20.1-1.2.3")
    }
    if (compatTestMode == 'native-power') {
        // Native POWER is the dependency-light fork of TLM: True POWER.
        def nativePowerDependency = file('tmp/compat-test/Native_POWER_of_Maid-1.20.1-1.0.1.jar').exists()
                ? "compat:Native_POWER_of_Maid:1.20.1-1.0.1"
                : "curse.maven:tlm-native-power-1404371:7384912"
        runtimeOnly fg.deobf("compat:mrqxs_Slashblade_Core:1.20.1-1.4.1")
        runtimeOnly fg.deobf(nativePowerDependency)
    }
    // ========================================
    // Touhou Little Maid（车万女仆）依赖
    // TLM 使用反射，不需要编译期依赖
    // ========================================

    // JEI（Just Enough Items）- 可选，用于配方查看
    // implementation fg.deobf("mezz.jei:jei-1.20.1-forge:15.x.x.x")
}

// 资源处理 - 替换 mods.toml 和 pack.mcmeta 中的占位符
// 关键：设置 UTF-8 编码，防止中文变乱码
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version,
            forge_version_range : forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description,
            tlm_mandatory       : galleryPreviewMode ? 'false' : 'true'
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Jar 配置
jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

// 发布配置
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = mod_group_id
            artifactId = mod_id
            version = mod_version
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
