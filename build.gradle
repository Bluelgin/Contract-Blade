plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.95'
}
group = mod_group_id
version = mod_version
base { archivesName = 'contract-blade-1.21.1-PORT-PROBE-NOT-FOR-PLAY' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
sourceSets {
    main {
        java.setSrcDirs(['src/port/java'])
        resources.setSrcDirs(['src/port/resources'])
    }
    test { java.setSrcDirs(['src/portTest/java']) }
}
repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            gameDirectory = project.file('run/port-smoke-server')
            programArgument '--nogui'
        }
        gameTestServer { type = 'gameTestServer' }
    }
    mods { maid_weapon_port_probe { sourceSet sourceSets.main } }
    // ModDevGradle does not put transformed Minecraft on plain Gradle test classpath.
    unitTest {
        enable()
        testedMod = mods.maid_weapon_port_probe
    }
}
dependencies {
    implementation 'maven.modrinth:touhou-little-maid:1.5.3-neoforge+mc1.21.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { 'LICENSE_maid_weapon_port_probe' } }
    manifest {
        attributes('Implementation-Title': 'Contract Blade port API probe, not a gameplay build')
    }
}
