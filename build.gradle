plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}


version = mod_version
group = mod_group_id

// Keep unfinished encounters in the development tree, physically absent from public builds.
def stableRelease = providers.gradleProperty('stableRelease').map { it.toBoolean() }.orElse(false).get()
if (stableRelease) {
    layout.buildDirectory.set(file('build/stable-release'))
    def staged = layout.buildDirectory.dir('release-inputs')
    def prepare = tasks.register('prepareStableRelease', Exec) {
        inputs.dir('src/main/java')
        inputs.dir('src/main/resources')
        inputs.file('tools/prepare_stable_release.py')
        outputs.dir(staged)
        commandLine 'python', 'tools/prepare_stable_release.py', staged.get().asFile.absolutePath
    }
    sourceSets.main.java.setSrcDirs([staged.get().dir('java')])
    sourceSets.main.resources.setSrcDirs([staged.get().dir('resources')])
    tasks.named('compileJava').configure { dependsOn prepare }
    tasks.named('processResources').configure { dependsOn prepare }
}

def compatTestMode = providers.gradleProperty('compatTest').orElse('vanilla').get()
def compatWorld = providers.gradleProperty('compatWorld').orNull
def tlmTestMode = providers.gradleProperty('tlmTest').orElse('latest').get()
def compatRunDir = providers.gradleProperty('compatRunDir').orNull
def homeLifeTestMode = providers.gradleProperty('homeLifeTest').map { it.toBoolean() }.orElse(false).get()

def ciMode = providers.gradleProperty('ci').map { it.toBoolean() }.orElse(false).get()
def galleryPreviewMode = providers.gradleProperty('galleryPreview')
        .map { it.toBoolean() }
        .orElse(false)
        .get()

repositories {
    flatDir {
        dirs 'libs', 'tmp/compat-test', 'tmp/compat-old'
    }
    // Canonical repositories avoid dynamic-version metadata failures through regional mirrors.
    mavenCentral()
    maven { url = "https://libraries.minecraft.net" }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // 本地库
}

base {
    // Public project name used by distribution sites. Keep mod_id unchanged so
    // existing worlds and registry names remain compatible.
    archivesName = "contract-blade-forge-${minecraft_version}"
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        rename { "LICENSE_${mod_id}" }
    }
    from('ASSET_SOURCES.md')
}

// Java 编译版本设置为 17（MC 1.20.1 要求）
// ForgeGradle 需要 toolchain 来正确处理映射
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 关键：设置编译和资源处理的UTF-8编码，防止中文乱码
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

minecraft {
    // 映射通道和版本（使用官方映射）
    mappings channel: 'official', version: minecraft_version

    // 运行配置
    runs {
        configureEach {
            workingDirectory project.file(compatRunDir ?: 'run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'contractblade.home.validation', galleryPreviewMode.toString()
            property 'contractblade.home.nativeValidation', homeLifeTestMode.toString()
            property 'contractblade.stress.validation', providers.gradleProperty('contractStressTest').orElse('false').get()
            property 'contractblade.epicfight.validation', providers.gradleProperty('epicFightTest').orElse('false').get()
            property 'contractblade.projection.validation', providers.gradleProperty('projectionTest').orElse('false').get()
            property 'contractblade.companion.validation', providers.gradleProperty('companionTest').orElse('false').get()
            property 'contractblade.rebirth.validation', providers.gradleProperty('contractRebirthTest').orElse('false').get()
            property 'contractblade.performance.validation', providers.gradleProperty('contractPerfTest').orElse('false').get()
            property 'contractblade.performance.label', providers.gradleProperty('contractPerfLabel').orElse('after').get()
            property 'contractblade.fox.validation', providers.gradleProperty('foxTest').orElse('false').get()
            property 'contractblade.whiteFoxSe.validation', providers.gradleProperty('whiteFoxSeTest').orElse('false').get()
            property 'contractblade.foxChallenge.validation', providers.gradleProperty('foxChallengeTest').orElse('false').get()
            property 'contractblade.blackFox.validation', providers.gradleProperty('blackFoxTest').orElse('false').get()
            property 'contractblade.blackFox.clientValidation', providers.gradleProperty('blackFoxClientTest').orElse('false').get()
            property 'forge.logging.console.level', 'debug'
            // Remap mixin refmaps from external 1.20.1 libraries in the userdev runtime.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--mixin', 'maid_weapon.mixins.json'
            args '--mixin', 'maid_weapon.akatsuki.mixins.json'
            args '--mixin', 'maid_weapon.slashblade.mixins.json'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            jvmArgs '-Xms384m', compatTestMode == 'epicfight' ? '-Xmx3072m' : '-Xmx1280m'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            jvmArgs '-Xms256m', '-Xmx1024m'
            args '--nogui'
            if (compatWorld) {
                args '--world', compatWorld
            }
        }

        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// 将生成的资源目录加入资源集
if (!stableRelease) sourceSets.main.resources { srcDir 'src/generated/resources' }


// 依赖配置
dependencies {
    // Optional local play-test UI only; remap the published jar rather than loading SRG names from run/mods.
    if (providers.gradleProperty('configScreens').map { it.toBoolean() }.orElse(false).get()) {
        runtimeOnly fg.deobf("local:configured:1.20.1-2.2.3")
    }
    // Minecraft Forge
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Only the native extension API is linked. TLM itself is never bundled.
    if (ciMode) {
        compileOnly fg.deobf("curse.maven:touhou-little-maid-355044:8061847")
    } else {
        compileOnly fg.deobf("local:touhoulittlemaid:1.5.3-forge+mc1.20.1")
    }

    // Native bauble extension compiles against the public TLM API. Runtime-only
    // launch profiles use the local jar; other integrations stay version-tolerant.
    if (!ciMode || homeLifeTestMode) {
        if (tlmTestMode == 'old') {
            runtimeOnly fg.deobf("compat:touhoulittlemaid:1.20.1-release-1.1.7")
        } else if (tlmTestMode == 'pack') {
            runtimeOnly fg.deobf("compat:touhoulittlemaid:1.5.2-forge+mc1.20.1")
        } else {
            runtimeOnly fg.deobf("local:touhoulittlemaid:1.5.3-forge+mc1.20.1")
        }
    }

    // Compile against TACZ without bundling it. Local development keeps the
    // ForgeGradle deobf path; clean CI uses the public CurseMaven jar directly
    // because only TACZ's stable API types are required at compile time.
    def localTacz = file('libs/tacz-1.20.1-1.1.8-release.jar').exists()
    def taczDependency = localTacz
            ? "local:tacz:1.20.1-1.1.8-release"
            : "curse.maven:timeless-and-classics-zero-1028108:8055552"
    if (ciMode && !localTacz) {
        compileOnly taczDependency
    } else {
        compileOnly fg.deobf(taczDependency)
    }
    if (compatTestMode == 'tacz' && !ciMode) {
        runtimeOnly fg.deobf(taczDependency)
    }

    // Optional local launch matrix. These are runtime-only and never bundled.
    if (providers.gradleProperty('handbookTest').orElse('false').get().toBoolean() && !ciMode) {
        runtimeOnly fg.deobf("compat:Patchouli:1.20.1-85-FORGE")
    }
    if (compatTestMode == 'epicfight' && !ciMode) {
        runtimeOnly fg.deobf("compat:epic-fight:20.14.17-mc1.20.1-forge")
        runtimeOnly fg.deobf("compat:EpicFight_TouhouLittleMaid:1.20.1-1.3.4")
        runtimeOnly fg.deobf("compat:epic-fight-avalon:7619938")
    }
    if (compatTestMode in ['goety', 'both', 'maidspell-goety', 'maidspell-both']) {
        runtimeOnly fg.deobf("compat:goety:2.5.55.4")
        runtimeOnly fg.deobf("compat:curios-forge:5.14.1+1.20.1")
    }
    if (compatTestMode in ['irons', 'both', 'maidspell-irons', 'maidspell-both']) {
        runtimeOnly fg.deobf("compat:irons_spellbooks:1.20.1-3.16.2")
        runtimeOnly fg.deobf("compat:curios-forge:5.14.1+1.20.1")
        runtimeOnly fg.deobf("compat:geckolib-forge-1.20.1:4.8.4")
        runtimeOnly fg.deobf("compat:player-animation-lib-forge:1.0.2-rc1+1.20")
        runtimeOnly fg.deobf("compat:irons_lib:1.20.1-2.1.0")
    }
    if (compatTestMode in ['maidspell-goety', 'maidspell-irons', 'maidspell-both']) {
        runtimeOnly fg.deobf("compat:touhou_little_maid_spell:1.8.0.1-forge+mc1.20.1")
    }
    if (compatTestMode in ['old-goety', 'old-both']) {
        runtimeOnly fg.deobf("compat:goety:2.5.1.2")
        runtimeOnly fg.deobf("compat:curios-forge:5.14.1+1.20.1")
    }
    if (compatTestMode in ['old-irons', 'old-both']) {
        runtimeOnly fg.deobf("compat:irons_spellbooks:1.20.1-1.2.1")
        runtimeOnly fg.deobf("compat:curios-forge:5.14.1+1.20.1")
        runtimeOnly fg.deobf("compat:geckolib-forge-1.20.1:4.8.4")
        runtimeOnly fg.deobf("compat:player-animation-lib-forge:1.0.2-rc1+1.20")
        runtimeOnly fg.deobf("compat:caelus-forge:3.2.0+1.20.1")
    }
    if (compatTestMode == 'patchouli') {
        // Development-only validation profile. Patchouli remains optional for shipped builds.
        runtimeOnly fg.deobf("compat:Patchouli:1.20.1-85-FORGE")
    }
    if (compatTestMode in ['slashblade', 'true-power', 'native-power']) {
        // Development-only validation profile. SlashBlade remains optional for shipped builds.
        runtimeOnly fg.deobf("compat:SlashBladeResharped:1.20.1-1.9.65")
    }
    if (providers.gradleProperty('foxBladeTetraTest').map { it.toBoolean() }.orElse(false).get()) {
        // Isolated fox-story verification only; never bundle these mod JARs.
        runtimeOnly fg.deobf("compat:SlashBladeResharped:1.20.1-1.9.65")
        def bladeTetraTestVersion = providers.gradleProperty('foxBladeTetraVersion').orElse('1.5.9').get()
        runtimeOnly fg.deobf("compat:blade_tetra:${bladeTetraTestVersion}")
        runtimeOnly fg.deobf("compat:tetra:6.3.0")
        runtimeOnly fg.deobf("compat:mutil:1.20.1-6.2.0")
    }
    if (providers.gradleProperty('tetraContainerTest').map { it.toBoolean() }.orElse(false).get()) {
        runtimeOnly fg.deobf("compat:tetra:6.3.0")
        runtimeOnly fg.deobf("compat:mutil:1.20.1-6.2.0")
    }
    if (compatTestMode == 'true-power') {
        // Full optional stack used to validate the dedicated maid task and soul baubles.
        runtimeOnly fg.deobf("compat:mrqxs_Slashblade_Core:1.20.1-1.4.1")
        runtimeOnly fg.deobf("compat:True_POWER:1.20.1-1.2.1-hotfix1")
        runtimeOnly fg.deobf("compat:True_POWER_of_Maid:1.20.1-1.2.3")
    }
    if (compatTestMode == 'native-power') {
        // Native POWER is the dependency-light fork of TLM: True POWER.
        def nativePowerDependency = file('tmp/compat-test/Native_POWER_of_Maid-1.20.1-1.0.1.jar').exists()
                ? "compat:Native_POWER_of_Maid:1.20.1-1.0.1"
                : "curse.maven:tlm-native-power-1404371:7384912"
        runtimeOnly fg.deobf("compat:mrqxs_Slashblade_Core:1.20.1-1.4.1")
        runtimeOnly fg.deobf(nativePowerDependency)
    }
    // ========================================
    // Touhou Little Maid（车万女仆）依赖
    // TLM 使用反射，不需要编译期依赖
    // ========================================

    // JEI（Just Enough Items）- 可选，用于配方查看
    // implementation fg.deobf("mezz.jei:jei-1.20.1-forge:15.x.x.x")
}

// 资源处理 - 替换 mods.toml 和 pack.mcmeta 中的占位符
// 关键：设置 UTF-8 编码，防止中文变乱码
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version,
            forge_version_range : forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license + (stableRelease ? '' : '; CC BY-4.0 (music)'),
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description,
            mod_asset_notice    : stableRelease
                ? '各类资源分别遵守其附带许可；代码许可不替代模型许可。'
                : '音乐 / Music: EpicBattle_J — PeriTune (Sei Mutsuki), CC BY 4.0。\n来源：https://peritune.com/blog/2021/09/16/epicbattle_j/\n署名、音频处理记录与完整条款见包内 licenses/black_fox_music/。',
            tlm_mandatory       : galleryPreviewMode ? 'false' : 'true'
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Jar 配置
jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'         : 'maid_weapon.mixins.json,maid_weapon.slashblade.mixins.json,maid_weapon.akatsuki.mixins.json',
        ])
    }
    finalizedBy 'reobfJar'
}

// 发布配置
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = mod_group_id
            artifactId = mod_id
            version = mod_version
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
