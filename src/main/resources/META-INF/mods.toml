modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
logoFile = "white-fox-mod-list.png"
logoBlur = true
description = '''${mod_description}

资源许可 / Asset licenses
代码 / Code: MIT（不覆盖第三方资源 / excludes third-party assets）。
双狐模型 / Fox models: CC BY-NC-SA 4.0，需署名、非商业使用、相同方式共享。
原始署名、修改记录与完整条款见包内 licenses/fox_models/。
${mod_asset_notice}'''

